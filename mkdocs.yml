site_name: exohab
site_url: https://kailash9342.github.io/exohab/
site_description: >-
  exohab is an open-source Python library for exoplanet habitability: Earth
  Similarity Index, habitable zones, Monte Carlo uncertainty and live NASA
  Exoplanet Archive data, with every formula cited.
site_author: Kailash Sivagnanam
repo_url: https://github.com/kailash9342/exohab
repo_name: kailash9342/exohab
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Kailash Sivagnanam &middot; MIT License

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
  - User guide:
      - Habitability metrics: guide/metrics.md
      - Habitable zone: guide/habitable-zone.md
      - Uncertainty (Monte Carlo): guide/uncertainty.md
      - NASA Exoplanet Archive data: guide/data.md
      - Machine-learning features: guide/ml.md
      - Plots: guide/plots.md
  - Science & methods: science.md
  - API reference: api.md
  - Examples: examples.md
  - About:
      - Citing exohab: citing.md
      - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kailash9342/exohab
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/exohab/
  social_card: assets/social-card.png
