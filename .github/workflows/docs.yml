name: docs

# Builds the documentation website with MkDocs (strict mode: any broken link
# or warning fails the build) and publishes it to GitHub Pages:
#   https://kailash9342.github.io/exohab/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation tools
        run: python -m pip install -e ".[docs]"
      - name: Build site (strict)
        run: python -m mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
