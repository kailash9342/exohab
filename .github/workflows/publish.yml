name: publish

# Uses PyPI "trusted publishing" (OpenID Connect): no API tokens are stored in
# the repository. A trusted publisher for this repository must be configured on
# pypi.org (and test.pypi.org for manual trial runs):
#   owner: kailash9342 | repository: exohab | workflow: publish.yml
#   environment: pypi (or testpypi)
#
# - Publishing a GitHub Release whose tag is v<version> (e.g. v0.2.1) uploads
#   that version to PyPI. The tag must match the version in pyproject.toml.
# - "Run workflow" (manual) uploads to TestPyPI for a trial.
# - Versions already on the index are skipped instead of failing, so a GitHub
#   Release for a version that was uploaded by hand (like 0.2.0) stays green.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi
      - run: python -m pip install -e ".[dev,all]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
